<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>MotoRoutes - Nueva contrasena</title></head>
<body style="font-family:system-ui,sans-serif;max-width:28rem;margin:4rem auto;padding:0 1rem">
  <h1>Nueva contrasena</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Cambiar contrasena</button>
    </form>
  {% else %}
    <p>Este enlace ya no es valido. Pide uno nuevo desde la app.</p>
  {% endif %}
</body>
</html>
